name: Docker image

# Builds the root Dockerfile and publishes it to ghcr.io/solostaran/warframestats
# - push to master      -> tags "latest" and "sha-xxxxxxx"
# - manual run (any branch, e.g. develop) -> tags "<branch>" and "sha-xxxxxxx"
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          # registry names must be lowercase (the repository is "WarframeStats")
          images: ghcr.io/solostaran/warframestats
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'master' }}
            type=ref,event=branch,enable=${{ github.ref_name != 'master' }}
            type=sha
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
