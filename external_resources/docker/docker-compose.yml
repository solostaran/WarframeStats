services:
  mongo-warstats:
    container_name: mongo-warstats-run
    image: mongo-warstats
    restart: unless-stopped
    volumes:
      - "./volumes/db:/data/db"
      - "./volumes/backup-db:/data/backup"
#    ports:
#      - "127.0.0.1:27017:27017"
    build:
      context: ./mongo-warstats
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--norc", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 90s
      start_interval: 2s
    networks:
      warstats-network:
        aliases:
            - net-db-warstats
  # Image built by GitHub Actions (.github/workflows/docker-image.yml).
  # Update : docker compose pull app-warstats && docker compose up -d app-warstats
  # Try a develop build or roll back : replace "latest" by "develop" or a "sha-xxxxxxx" tag
  app-warstats:
    depends_on:
      mongo-warstats:
        condition: service_healthy
    container_name: app-warstats-run
    image: ghcr.io/solostaran/warframestats:latest
#    restart: always
    restart: on-failure:2
    networks:
      warstats-network:
        aliases:
          - net-app-warstats
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - DOCKER=true
      - DEBUG=warframestats:*
      - HTTP=true
    links:
      - mongo-warstats
networks:
  warstats-network:
    driver: bridge
